name: bom-mgmt

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: bom
      POSTGRES_DB: bom
    # Loopback only: Docker's published ports bypass host firewalls (ufw etc.),
    # and this database holds password hashes and sessions. The app container
    # reaches it over the compose network either way. 5433 on the host so it
    # doesn't collide with another local Postgres.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for part images and datasheets. Optional — set
  # STORAGE_BACKEND=filesystem to keep files on a volume instead.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} &&
             mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-inventory}

  # Full self-hosted deployment: docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    # Loopback only, for the same reason as postgres: terminate TLS in a
    # reverse proxy on the same host and point it at 127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://bom:bom@postgres:5432/bom
      # Required, no default: guards sessions. openssl rand -base64 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET to a long random string}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # OAuth2 / OIDC sign-in (see .env.example)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # "s3" (the bundled MinIO by default) or "filesystem"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/files}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-inventory}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - file-data:/app/data

volumes:
  postgres-data:
  minio-data:
  file-data:
